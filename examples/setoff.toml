# SetOff clearing service configuration.
listen = "127.0.0.1:7500"

# Journals and archived windows. Relative to this file.
data_dir = "data"

# Close the open window on a schedule (empty windows are skipped). Leave out
# to close only when the operator asks.
close_every = "1h"

# Bearer key the operator uses to close windows.
operator_key_env = "SETOFF_OPERATOR_KEY"

# Asset codes obligations may use. Leave out to allow any.
assets = ["USDC", "EURC"]

# On-chain settlement through the SetOff settlement contract (optional; used by
# `setoff soroban`). Each participant below also gets its Stellar address.
contract = "CCW6QCOSJTTJHDXJOVQ36NVIBAHBUVPMSZNOIJ3A444O6YMVHR4ZEYQV"

[tokens]
USDC = "CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA"
EURC = "CCUUDM434BMZMYWYDITHFXHDMIVTGGD6T2I5UKNX5BSLXLW7HVR4MCGZ"

# Every participant, the environment variable holding its API key and its
# Stellar address. A participant can only record obligations it owes.
[[participant]]
id = "anchor-ng"
key_env = "SETOFF_KEY_ANCHOR_NG"
address = "GAIH3ULLFQ4DGSECF2AR555KZ4KNDGEKN4AFI4SU2M7B43MGK3QJZNSR"

[[participant]]
id = "anchor-us"
key_env = "SETOFF_KEY_ANCHOR_US"
address = "GBRPYHIL2CI3FNQ4BXLFMNDLFJUNPU2HY3ZMFSHONUCEOASW7QC7OX2H"

[[participant]]
id = "anchor-ke"
key_env = "SETOFF_KEY_ANCHOR_KE"
address = "GCDNJUBQSX7AJWLJACMJ7I4BC3Z47BQUTMHEICZLE6MU4KQBRYG5JY6B"

# Decimal places per asset. Amounts are integers in the smallest unit; reports
# such as camt.053 statements show them in whole units.
[decimals]
USDC = 7
EURC = 7

# Told about every closed window with a signed POST (optional). Receivers
# verify X-SetOff-Signature: sha256=HMAC(secret, "<X-SetOff-Timestamp>.<body>").
# Settle closed windows on chain from the service (optional): it collects each
# debtor's authorization over the API, submits the batches and calls settle.
# The operator account must be the contract's admin.
[settlement]
rpc = "https://soroban-testnet.stellar.org"
network = "testnet"
operator_secret_env = "SETOFF_OPERATOR_SECRET"
prepare_on_close = true
# validity_ledgers = 720   # how long debtors have to sign, about an hour

[webhook]
url = "https://treasury.example.org/setoff"
secret_env = "SETOFF_WEBHOOK_SECRET"

# Participants sign in with their Stellar accounts (SEP-10) instead of, or as
# well as, API keys (optional). Serve this behind TLS at home_domain.
[sep10]
home_domain = "clearing.example.org"
network = "testnet"
signing_key_env = "SETOFF_SEP10_SIGNING_SEED"
token_secret_env = "SETOFF_SEP10_TOKEN_SECRET"
