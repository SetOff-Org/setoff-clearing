version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      # Best-effort cleanup and writes to an HTTP response whose client may be gone.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - os.Remove
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors are already covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
